source [find interface/cmsis-dap.cfg]

# 无线 DAP 主机（Mini）串号；换目标板请同步改 mcu-debug.json 里的 openocd_args
adapter serial 183b2401

transport select swd

# 目标：TI MSPM0G3507。使用 xpack OpenOCD 自带的 version-matched target/ti_mspm0.cfg。
# 注意：不要改用工程根 mspm0l.cfg —— 其实测会在 program / reset run 后把 CPU 留在 NMI，
# 导致固件看似 running 但实际不执行（Tick 不递增）。
source [find target/ti_mspm0.cfg]

# 无线 CMSIS-DAP 保守 SWD 时钟
adapter speed 1000